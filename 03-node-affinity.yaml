apiVersion: v1
kind: pod
meatadata:
  name: nginx
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - us-east-1f

  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: Always